[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpscope"
version = "0.1.0"
description = "Security scanner for MCP configs and tool definitions: catches tool poisoning, hardcoded secrets and risky launch commands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tanishq Jaiswal" }]
keywords = ["mcp", "model-context-protocol", "security", "llm", "prompt-injection", "scanner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcpscope = "mcpscope.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/mcpscope"

[tool.setuptools.packages.find]
include = ["mcpscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
